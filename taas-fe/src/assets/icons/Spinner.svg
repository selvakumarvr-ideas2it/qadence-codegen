<?xml version="1.0" encoding="UTF-8"?>
<svg width="28" height="28" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Loading">
  <!-- Light background ring -->
  <circle
    cx="25"
    cy="25"
    r="20"
    fill="none"
    stroke="#E6F0FF"
    stroke-width="4"
  />

  <!-- Blue rotating arc -->
  <circle
    cx="25"
    cy="25"
    r="20"
    fill="none"
    stroke="#0B69FF"
    stroke-width="4"
    stroke-linecap="round"
    stroke-dasharray="70 125"
    stroke-dashoffset="0"
  >
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 25 25"
      to="360 25 25"
      dur="1s"
      repeatCount="indefinite"
    />
  </circle>
</svg>
