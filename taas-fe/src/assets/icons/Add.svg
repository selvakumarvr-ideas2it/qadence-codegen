<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Shadow -->
  <circle cx="50" cy="50" r="20" fill="white" stroke="currentColor" stroke-width="2"/>
  <circle cx="50" cy="50" r="20" fill="white" filter="url(#shadow)" stroke="currentColor" stroke-width="2"/>

  <!-- Plus Sign -->
  <line x1="50" y1="40" x2="50" y2="60" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
  <line x1="40" y1="50" x2="60" y2="50" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>

  <!-- Shadow Filter -->
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="currentColor" flood-opacity="0.3"/>
    </filter>
  </defs>
</svg>
